<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Volunteer and Donation Portal</title>

     <!-- Title image -->
   <link href="static/media/ngologo.png" rel="icon">
   
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .user-message, .bot-message {
            max-width: 75%;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }
        .bot-message {
            background: #e9ecef;
            align-self: flex-start;
        }
        .input-container {
            display: flex;
            padding: 10px;
            background: #fff;
            border-top: 1px solid #ddd;
        }
        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .typing-indicator {
            font-size: 12px;
            font-style: italic;
            color: gray;
            margin-bottom: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <button onclick="goBack()" style="
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: #6c757d;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
">
    ← Go Back
</button>


    <div class="chat-container">
        
        <div class="chat-header">Chatbot</div>
        <div class="chat-box" id="chatBox">
            <div class="bot-message">Hello! How can I help you?</div>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type your question...">
            <button onclick="sendMessage()" type="submit"   >Send</button>
            
        </div>
        
    </div> <br>
    

    <script>
        function sendMessage() {
            let userInput = document.getElementById("userInput").value.trim();
            if (userInput === "") return;

            let chatBox = document.getElementById("chatBox");

            // Append user message
            let userMessage = document.createElement("div");
            userMessage.className = "user-message";
            userMessage.innerText = userInput;
            chatBox.appendChild(userMessage);

            // Clear input field
            document.getElementById("userInput").value = "";

            // Show typing indicator
            let typingIndicator = document.createElement("div");
            typingIndicator.className = "typing-indicator";
            typingIndicator.innerText = "Typing...";
            chatBox.appendChild(typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Fetch response from Django
            fetch(`/chatbot-response/?query=${encodeURIComponent(userInput)}`)
                .then(response => response.json())
                .then(data => {
                    chatBox.removeChild(typingIndicator);
                    displayBotResponse(data.response);
                });
        }

        function displayBotResponse(response) {
            let chatBox = document.getElementById("chatBox");
            let botMessage = document.createElement("div");
            botMessage.className = "bot-message";
            chatBox.appendChild(botMessage);

            let i = 0;
            function typeWriter() {
                if (i < response.length) {
                    botMessage.innerHTML += response.charAt(i);
                    i++;
                    setTimeout(typeWriter, 30);
                }
            }
            typeWriter();

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        
    </script>

    <script>
    function goBack() {
        window.history.back();
    }
</script>


</body>
</html>
