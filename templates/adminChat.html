{% extends 'adminHome.html' %}
{% block content %}
<br><br><br>

<section id="services" class="services section">
  <div class="container">
    <div class="section-title text-center mb-4">
      <h2>Add ChatBot Questions</h2>
      <p class="text-muted">Enter keywords and their respective responses for the chatbot.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
              <label for="keyword" class="form-label">Keyword</label>
              <input type="text" class="form-control" id="keyword" name="keyword" placeholder="e.g. donation" required>
            </div>

            <div class="mb-3">
              <label for="answer" class="form-label">Answer</label>
              <textarea class="form-control" id="answer" name="answer" rows="4" placeholder="Enter chatbot response..." required></textarea>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Add Question</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Alert Messages -->
{% for i in messages %}
<script>
  alert("{{ i }}");
</script>
{% endfor %}

{% endblock %}
